# This is a Declarative Automation Bundle definition for vertice.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: 9c3b7a03-7da9-4638-88d7-d9dbb77a4626

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/araujorod@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/araujorod@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: araujorod@outlook.com
        level: CAN_MANAGE
