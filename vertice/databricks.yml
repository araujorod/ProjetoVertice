# Bundle vertice · Projeto Farol (Vértice Tecnologia)
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: 9c3b7a03-7da9-4638-88d7-d9dbb77a4626

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo do Lakehouse da Vértice
    default: lakehouse_vertice
  warehouse_id:
    description: SQL warehouse das sql_task (Serverless Starter Warehouse)
    default: dc7b8d0d81c6d177
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    # Sem mode: development (ele prefixa os nomes com [dev usuario]).
    # O preset deixa todo agendamento e gatilho pausado no dev.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/araujorod@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/araujorod@outlook.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: araujorod@outlook.com
        level: CAN_MANAGE
