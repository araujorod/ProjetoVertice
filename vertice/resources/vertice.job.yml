resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      tasks:
        - task_key: ingestao_data_lake
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://ogwfumetgdzhwqgrvkof.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/ingestao/02_ingestao_boto3_gabarito.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: ingestao_feriados
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/ingestao/01_ingestao_api.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        # confere as 9 tabelas da bronze antes de montar a silver
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_data_lake
            - task_key: ingestao_feriados
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # pipeline declarativo: silver e gold
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

        # os 10 testes de qualidade (raise_error derruba a tarefa se algum falhar)
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
